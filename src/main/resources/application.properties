# ==============================================================================
# EnrollX - Application Configuration
# Course Registration System with Real-Time Seat Locking
# ==============================================================================

spring.application.name=EnrollX
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection Settings
# Customize DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD via environment 
# variables or edit the default fallback values below.
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/enrollx_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sanjana@12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Configuration
# Sized appropriately for concurrent student seat locking requests
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# JPA & Hibernate Settings
# ddl-auto=update allows Hibernate to safely update or verify entity schemas
# Set to 'validate' if you only want strict verification against database/enrollx_db.sql
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine Settings
# Cache disabled for instantaneous HTML/CSS template reloading in development
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# EnrollX Business Logic & Concurrency Settings
# ------------------------------------------------------------------------------
# Seat reservation holding duration in minutes (Student has this much time to confirm)
enrollx.reservation.duration-minutes=5

# Interval in milliseconds for background cleanup of expired reservations (30 seconds)
enrollx.scheduler.cleanup-interval-ms=30000

# DataInitializer flag: auto-populates default admin and sample courses if database is empty
enrollx.init.seed-sample-data=true

# Logging levels for SQL and application transactions
logging.level.com.enrollx=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
