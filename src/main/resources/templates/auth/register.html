<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — EnrollX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #1e1b4b 100%); min-height: 100vh;">

<div class="container d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">
    <div class="card card-enrollx border-0 shadow-lg" style="max-width: 580px; width: 100%; border-radius: 20px; overflow: hidden;">
        <!-- Top Gradient Accent Bar -->
        <div style="height: 6px; background: linear-gradient(90deg, #10b981 0%, #06b6d4 50%, #4f46e5 100%);"></div>

        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3" 
                     style="width: 56px; height: 56px; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);">
                    <i class="bi bi-person-badge-fill fs-2"></i>
                </div>
                <h3 class="fw-extrabold text-dark tracking-tight mb-1">Create Student Profile</h3>
                <p class="text-secondary small">Enroll in university course offerings with real-time seat locks</p>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-12">
                        <label for="fullName" class="form-label fw-bold small text-secondary">Full Student Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person-vcard"></i></span>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" 
                                   th:errorclass="is-invalid" placeholder="e.g. Alice Johnson" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="studentId" class="form-label fw-bold small text-secondary">Institutional ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted font-monospace">#</span>
                            <input type="text" id="studentId" th:field="*{studentId}" class="form-control font-monospace" 
                                   th:errorclass="is-invalid" placeholder="e.g. STU2026005" required>
                            <div class="invalid-feedback" th:errors="*{studentId}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="username" class="form-label fw-bold small text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">@</span>
                            <input type="text" id="username" th:field="*{username}" class="form-control" 
                                   th:errorclass="is-invalid" placeholder="e.g. ajohnson" required>
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label fw-bold small text-secondary">University Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope-at"></i></span>
                            <input type="email" id="email" th:field="*{email}" class="form-control" 
                                   th:errorclass="is-invalid" placeholder="e.g. alice.johnson@enrollx.edu" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label fw-bold small text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" id="regPassword" th:field="*{password}" class="form-control" 
                                   th:errorclass="is-invalid" placeholder="Min. 6 chars" required>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label fw-bold small text-secondary">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" 
                                   th:errorclass="is-invalid" placeholder="Repeat password" required>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>
                </div>

                <div class="p-3 bg-light rounded-3 border mt-3 small text-muted">
                    <i class="bi bi-shield-lock-fill text-success me-1"></i>
                    Credentials are encrypted with <strong>BCrypt (Work Factor 10)</strong> and stored in MySQL InnoDB.
                </div>

                <button type="submit" class="btn btn-primary-enrollx w-100 py-2 mt-4 mb-3">
                    <i class="bi bi-check2-circle me-1"></i> Complete Student Registration
                </button>
            </form>

            <div class="text-center pt-2 border-top">
                <p class="small text-muted mb-0">Already registered? 
                    <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">
                        Sign In Here <i class="bi bi-arrow-right-short"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
