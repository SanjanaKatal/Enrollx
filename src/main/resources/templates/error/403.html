<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied — EnrollX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #1e1b4b 100%); min-height: 100vh;">

<div class="container d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">
    <div class="card card-enrollx border-0 shadow-lg text-center p-4 p-md-5" style="max-width: 520px; width: 100%; border-radius: 20px;">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mx-auto mb-3" 
             style="width: 72px; height: 72px; background: rgba(245, 158, 11, 0.15); color: #f59e0b;">
            <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
        <h3 class="fw-extrabold text-dark tracking-tight mb-2">403 — Access Denied</h3>
        <p class="text-secondary small mb-4">
            You do not possess the required security role (e.g. <code>ROLE_ADMIN</code>) to view or modify this administrative endpoint.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-primary-enrollx rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i>Return to Safe Area
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
