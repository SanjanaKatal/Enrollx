spring.application.name=EnrollX-Test
spring.datasource.url=jdbc:h2:mem:enrollx_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
enrollx.reservation.duration-minutes=5
enrollx.scheduler.cleanup-interval-ms=60000
enrollx.init.seed-sample-data=false
